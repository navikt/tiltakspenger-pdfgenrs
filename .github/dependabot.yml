version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
      # Demo-appen i dev.
      # Basebildet er Chainguard-speilet med flytende tagg, så Dependabot finner ingen bumps her; oppføringen står igjen for den dagen bildet får en versjonert tagg.
      - "/devtools/brev-preview"
      - "/test"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7