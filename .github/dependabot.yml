version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
      # Demo-appen i dev.
      # Basebildet ligger i Navs private Chainguard-speil, som Dependabot ikke har tilgang til: ingen bumps her uansett tagg eller digest.
      # Oppføringen står igjen for den dagen Nav gir Dependabot tilgang (OIDC mot Artifact Registry).
      - "/devtools/brev-preview"
      - "/test"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "ghcr.io/navikt/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7    # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "nais/*"
        - "navikt/*"
