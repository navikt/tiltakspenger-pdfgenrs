name: Lint workflows

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [ main ]
    paths:
      - '.github/**'

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  lint:
    # Delt workflow i metarepoet: actionlint + zizmor (begge blokkerende).
    # Konvensjoner: https://github.com/navikt/tiltakspenger-workflows/blob/main/.github/workflows/README.md
    permissions:
      contents: read
    uses: navikt/tiltakspenger-workflows/.github/workflows/lint-workflows.yml@main
    with:
      # Begrunnet avvik: repoet har docker-økosystem i tillegg til github-actions, og passer derfor
      # ikke dependabot-actions-malen. Konfigen holdes ajour manuelt.
      dependabot-mal: ingen
