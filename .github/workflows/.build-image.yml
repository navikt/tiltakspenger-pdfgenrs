name: Build docker image

on:
  workflow_call:
    inputs:
      DOCKERFILE:
        description: "Dockerfile som bygges. Konteksten er alltid repo-rota."
        required: false
        type: string
        default: Dockerfile
      IMAGE_SUFFIX:
        description: "Suffiks på imagenavnet, slik at flere image fra samme repo ikke overskriver hverandre (f.eks. «demo»)."
        required: false
        type: string
        default: ""
    outputs:
      IMAGE:
        description: "Docker image"
        value: ${{ jobs.build.outputs.IMAGE }}

jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      IMAGE: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and push docker image
        # Versjonsoversikt: https://github.com/nais/docker-build-push/tags
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: tpts
          dockerfile: ${{ inputs.DOCKERFILE }}
          image_suffix: ${{ inputs.IMAGE_SUFFIX }}
