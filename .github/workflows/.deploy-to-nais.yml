name: Deploy to NAIS

on:
  workflow_call:
    inputs:
      NAIS_ENV:
        required: true
        type: string
      IMAGE:
        required: true
        type: string
      RESOURCE:
        description: "Nais-manifestet som deployes. Demo-appen (.nais/nais-demo.yml) deployes kun til dev."
        required: false
        type: string
        default: .nais/nais.yml

jobs:
  deploy:
    name: Deploy to NAIS (${{ inputs.NAIS_ENV }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.NAIS_ENV }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to NAIS
        # Versjonsoversikt (tag -> SHA): https://github.com/nais/deploy/tags
        # Denne SHA-en: https://github.com/nais/deploy/commit/2d18f050f07b6a007864c6a57070ed915d571beb
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: ${{ inputs.NAIS_ENV }}-gcp
          RESOURCE: ${{ inputs.RESOURCE }}
          VAR: image=${{ inputs.IMAGE }}
          VARS: .nais/vars/${{ inputs.NAIS_ENV }}.yml
