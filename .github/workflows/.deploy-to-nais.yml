name: Deploy to NAIS

on:
  workflow_call:
    inputs:
      NAIS_ENV:
        required: true
        type: string
      IMAGE:
        required: true
        type: string
      RESOURCE:
        description: "Nais-manifestet som deployes. Demo-appen (.nais/nais-demo.yml) deployes kun til dev."
        required: false
        type: string
        default: .nais/nais.yml

jobs:
  deploy:
    name: Deploy to NAIS (${{ inputs.NAIS_ENV }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.NAIS_ENV }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to NAIS
        # Versjonsoversikt: https://github.com/nais/deploy/tags
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: ${{ inputs.NAIS_ENV }}-gcp
          RESOURCE: ${{ inputs.RESOURCE }}
          VAR: image=${{ inputs.IMAGE }}
          VARS: .nais/vars/${{ inputs.NAIS_ENV }}.yml
