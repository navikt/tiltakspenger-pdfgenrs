# Kjører brevtestene (test/run-tests.py) i Docker, samme oppsett som ./run_tests.sh lokalt.
# Brukes som deploy-gate fra deploy-dev.yml og deploy-prod.yml.
name: Test brevmaler

on:
  workflow_call:

jobs:
  test:
    name: Test brevmaler
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kjør brevtestene
        run: ./run_tests.sh
      - name: Last opp debugfiler
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-debug
          path: build/test/
          if-no-files-found: ignore
